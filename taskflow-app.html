<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TaskFlow — Task Manager</title>
<style>
:root{
  --bg:#f5f6f8; --card:#ffffff; --text:#1a1d23; --muted:#6b7280;
  --accent:#0d9488; --accent-hover:#0f766e; --border:#e2e4e9; --err:#dc2626; --ok:#16a34a;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171c; --card:#1e2129; --text:#e8e9ec; --muted:#9096a3; --border:#2c3038;
  }
}
:root[data-theme="dark"]{ --bg:#15171c; --card:#1e2129; --text:#e8e9ec; --muted:#9096a3; --border:#2c3038; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px 16px;}
.wrap{max-width:560px;margin:0 auto;}
h1{font-size:20px;margin:0 0 4px;}
p.sub{color:var(--muted);font-size:14px;margin:0 0 20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;}
label:first-of-type{margin-top:0;}
input,select{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px;}
button{margin-top:20px;width:100%;padding:11px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
button:hover{background:var(--accent-hover);}
.msg{margin-top:12px;font-size:13px;padding:10px;border-radius:8px;display:none;}
.msg.ok{display:block;background:rgba(22,163,74,.12);color:var(--ok);}
.msg.err{display:block;background:rgba(220,38,38,.12);color:var(--err);}
.filterRow{margin-top:24px;}
.list h2{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:16px 0 10px;}
.task{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;font-size:13px;background:var(--card);display:flex;justify-content:space-between;align-items:center;gap:10px;}
.task .info b{display:block;font-size:14px;}
.task .meta{color:var(--muted);font-size:12px;margin-top:2px;}
.del{margin:0;width:auto;padding:6px 10px;background:transparent;color:var(--err);border:1px solid var(--err);font-size:12px;}
.del:hover{background:rgba(220,38,38,.08);}
.empty{color:var(--muted);font-size:13px;}
.priority{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--border);margin-left:6px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>TaskFlow — Task Manager</h1>
  <p class="sub">Sample app for QA practice.</p>
  <div class="card">
    <label for="title">Task Title</label>
    <input id="title" type="text" placeholder="Write the quarterly report">

    <label for="dueDate">Due Date</label>
    <input id="dueDate" type="date">

    <label for="priority">Priority</label>
    <select id="priority">
      <option value="">-- Select --</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
    </select>

    <label for="email">Assignee Email</label>
    <input id="email" type="text" placeholder="alex@example.com">

    <button id="addBtn" onclick="addTask()">Add Task</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="filterRow">
    <label for="filter">Filter tasks by title</label>
    <input id="filter" type="text" placeholder="Type to filter...">
  </div>

  <div class="list">
    <h2>Tasks</h2>
    <div id="taskList"><div class="empty">No tasks yet.</div></div>
  </div>
</div>

<script>
let tasks = [];
let nextId = 1;

document.getElementById('filter').addEventListener('input', function(){
  render();
});

function addTask(){
  const title = document.getElementById('title').value;
  const dueDate = document.getElementById('dueDate').value;
  const priority = document.getElementById('priority').value;
  const email = document.getElementById('email').value;

  const trimmedTitle = title.trim();
  if(!trimmedTitle){
    showMsg('Task title is required', 'err');
    return;
  }
  if(trimmedTitle.length > 100){
    showMsg('Task title must be 100 characters or fewer', 'err');
    return;
  }
  if(!dueDate){
    showMsg('Due date is required', 'err');
    return;
  }
  const todayStr = new Date().toISOString().slice(0, 10);
  if(dueDate < todayStr){
    showMsg('Due date cannot be in the past', 'err');
    return;
  }
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if(!emailRegex.test(email)){
    showMsg('Please enter a valid email', 'err');
    return;
  }

  tasks.push({ id: nextId++, title: trimmedTitle, dueDate: dueDate, priority: priority, email: email });
  render();
  showMsg('Task added successfully!', 'ok');

  document.getElementById('title').value = '';
  document.getElementById('dueDate').value = '';
  document.getElementById('priority').value = '';
  document.getElementById('email').value = '';
}

function showMsg(text, type){
  const msg = document.getElementById('msg');
  msg.textContent = text;
  msg.className = 'msg ' + type;
}

function deleteTask(id){
  tasks = tasks.filter(function(t){ return t.id !== id; });
  render();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(){
  const filterText = document.getElementById('filter').value.toLowerCase();
  const list = document.getElementById('taskList');
  const filtered = filterText
    ? tasks.filter(function(t){ return t.title.toLowerCase().includes(filterText); })
    : tasks;

  if(filtered.length === 0){
    list.innerHTML = '<div class="empty">No tasks yet.</div>';
    return;
  }

  list.innerHTML = filtered.map(function(t){
    return '<div class="task">' +
      '<div class="info"><b>' + escapeHtml(t.title) + '</b>' +
      '<div class="meta">Due ' + escapeHtml(t.dueDate) + ' · ' + escapeHtml(t.email) +
      '<span class="priority">' + escapeHtml(t.priority || 'None') + '</span></div></div>' +
      '<button class="del" onclick="deleteTask(' + t.id + ')">Delete</button>' +
      '</div>';
  }).join('');
}
</script>
</body>
</html>
